on:
  - push
  - pull_request

name: Main

env:
  RUST_BACKTRACE: '1'

jobs:
  build:
    strategy:
      matrix:
        include:
          - rust-target: x86_64-pc-windows-msvc
            artifact-name: win64
          - rust-target: i686-pc-windows-msvc
            artifact-name: win32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: mtkennerly/dunamai-action@v1
        with:
          env-var: DUNAMAI_VERSION
          args: --style semver
      - uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.rust-target }}
          toolchain: stable
      - run: cargo build --release --target ${{ matrix.rust-target }}
      - uses: actions/upload-artifact@v4
        with:
          name: shawl-v${{ env.DUNAMAI_VERSION }}-${{ matrix.artifact-name }}
          path: target/${{ matrix.rust-target }}/release/shawl.exe

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked -- --test-threads 1
      - name: Validate generated native service definitions
        if: runner.os != 'Windows'
        run: cargo test --locked --bin shawl -- --ignored
      - name: Native system service lifecycle smoke test
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: bash tests/native-smoke.sh system "$(pwd)/target/debug/shawl"

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
